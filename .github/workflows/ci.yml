name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makerspace
          POSTGRES_USER: makerspace
          POSTGRES_PASSWORD: makerspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: makerspace
      PGUSER: makerspace
      PGPASSWORD: makerspace
      DATABASE_URL: postgresql://makerspace:makerspace@localhost:5432/makerspace
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Lint backend
        run: npm run lint:backend

      - name: Type-check frontend
        run: npm run typecheck

      - name: Backend identity tests
        run: npm run test:identity

      - name: Backend workspace tests
        run: npm run test:workspace

      - name: Backend media tests
        run: npm run test:media

      - name: Backend contract tests
        run: npm run test:contracts

      - name: Backend provenance tests
        run: npm run test:provenance

      - name: Backend PayPal tests
        run: npm run test:paypal

      - name: Backend payroll tests
        run: npm run test:payroll

      - name: Redis integration test
        run: npm run test:redis

      - name: Build frontend
        run: npm run frontend:build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e
